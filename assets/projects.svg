al,sans-serif" font-size="13" fill="#c9d1d9">JWT auth with admin and viewer roles, Docker setup and</text><text x="33" y="174" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" fill="#c9d1d9">pytest tests.</text><rect x="19" y="188" width="57.599999999999994" height="20" rx="10" fill="#44D62C" fill-opacity="0.08" stroke="#44D62C" stroke-opacity="0.45"/><text x="47.8" y="202" text-anchor="middle" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="11" fill="#44D62C">Python</text><rect x="84.6" y="188" width="64.19999999999999" height="20" rx="10" fill="#44D62C" fill-opacity="0.08" stroke="#44D62C" stroke-opacity="0.45"/><text x="116.69999999999999" y="202" text-anchor="middle" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="11" fill="#44D62C">FastAPI</text><rect x="156.79999999999998" y="188" width="57.599999999999994" height="20" rx="10" fill="#44D62C" fill-opacity="0.08" stroke="#44D62C" stroke-opacity="0.45"/><text x="185.59999999999997" y="202" text-anchor="middle" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="11" fill="#44D62C">Docker</text><rect x="222.39999999999998" y="188" width="51.0" height="20" rx="10" fill="#44D62C" fill-opacity="0.08" stroke="#44D62C" stroke-opacity="0.45"/><text x="247.89999999999998" y="202" text-anchor="middle" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="11" fill="#44D62C">Linux</text><rect x="458.0" y="1" width="441.0" height="228" rx="16" fill="#0a0a0a"/><rect x="458.0" y="1" width="441.0" height="228" rx="16" fill="url(#g)"/><rect x="458.5" y="1.5" width="440.0" height="227" rx="15.5" fill="none" stroke="#44D62C" stroke-opacity="0.4"/><rect x="476.0" y="14" width="3" height="16" rx="1.5" fill="#44D62C"/><text x="486.0" y="27" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#44D62C">Pay-Money</text><text x="476.0" y="46" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e" letter-spacing="0.3">PEER-TO-PEER PAYMENT APP</text><rect x="476.0" y="66" width="5" height="5" rx="1" fill="#44D62C"/><text x="490.0" y="74" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" fill="#c9d1d9">Sign up, search users, send money and view transaction</text><text x="490.0" y="92" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" fill="#c9d1d9">history over a REST API.</text><rect x="476.0" y="107" width="5" height="5" rx="1" fill="#44D62C"/><text x="490.0" y="115" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" fill="#c9d1d9">Atomic transfers using MongoDB multi-document</text><text x="490.0" y="133" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" fill="#c9d1d9">transactions, with failures logged.</text><rect x="476.0" y="148" width="5" height="5" rx="1" fill="#44D62C"/><text x="490.0" y="156" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" fill="#c9d1d9">JWT and bcrypt auth, plus email-OTP recovery that</text><text x="490.0" y="174" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" fill="#c9d1d9">expires after 5 minutes.</text><rect x="476.0" y="188" width="64.19999999999999" height="20" rx="10" fill="#44D62C" fill-opacity="0.08" stroke="#44D62C" stroke-opacity="0.45"/><text x="508.1" y="202" text-anchor="middle" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="11" fill="#44D62C">Node.js</text><rect x="548.2" y="188" width="64.19999999999999" height="20" rx="10" fill="#44D62C" fill-opacity="0.08" stroke="#44D62C" stroke-opacity="0.45"/><text x="580.3000000000001" y="202" text-anchor="middle" font-family="SFMono-Regular,Consolas,Menlo,monospace"